services:
  affiliate:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    networks:
      proxy:
        aliases:
          - krespace-links-app

networks:
  proxy:
    external: true
    name: ${CADDY_NETWORK:?Isi CADDY_NETWORK dengan nama network Docker Caddy}
